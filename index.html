<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>金春喜餐器具叫貨</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: sticky brand+tab header, one scrolling column (max 760px), sticky bottom total bar on the order view. Tool is phone-first for store staff. */
:root{
  --bg:#F2F1F0; --surface:#FFFFFF; --ink:#1F1D1C; --muted:#6B6663; --line:#E1DDDA;
  --accent:#B42318; --accent-ink:#FFFFFF; --accent-soft:#FBE8E5; --ok:#1B7F4B; --ok-soft:#E3F3EA; --chip:#EAE7E4;
  --w:760px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151413; --surface:#201E1D; --ink:#F1EEEC; --muted:#A59F9B; --line:#35322F;
  --accent:#E0472F; --accent-ink:#FFFFFF; --accent-soft:#3A1F1A; --ok:#5DCB8D; --ok-soft:#173223; --chip:#2D2A28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151413; --surface:#201E1D; --ink:#F1EEEC; --muted:#A59F9B; --line:#35322F;
  --accent:#E0472F; --accent-ink:#FFFFFF; --accent-soft:#3A1F1A; --ok:#5DCB8D; --ok-soft:#173223; --chip:#2D2A28; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:var(--w);margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.head{max-width:var(--w);margin:0 auto;padding-top:10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:1.15rem;letter-spacing:.04em}
.brand span{color:var(--muted);font-size:.85rem}
nav{display:flex;gap:2px;margin-top:6px}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:9px 4px;font-weight:500;color:var(--muted)}
nav button[aria-current="page"]{color:var(--accent);border-color:var(--accent);font-weight:700}
nav .n{display:inline-block;min-width:1.4em;padding:0 6px;margin-left:4px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.75rem;line-height:1.5}
nav .n:empty{display:none}
main{padding-top:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:14px}
h2{font-size:1rem;margin:0 0 10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
.input,select.input,textarea.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.seg{display:flex;background:var(--chip);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:8px 6px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.seg .c{font-size:.75rem;color:var(--accent);margin-left:3px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.85rem;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;padding:10px;align-items:center;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.on{background:var(--accent-soft)}
.thumb{flex:none;width:64px;height:64px;border-radius:8px;background:var(--chip);border:1px solid var(--line);object-fit:cover;padding:0;display:block;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.none{display:grid;place-items:center;color:var(--muted);font-size:.7rem}
.nm{font-weight:500;overflow-wrap:anywhere}
.meta{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--muted);margin-right:4px}
.price{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.price b{color:var(--ink)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.step button{width:38px;height:40px;border:0;background:var(--chip);font-size:1.2rem;line-height:1}
.step input{width:48px;height:40px;border:0;text-align:center;background:transparent;font-variant-numeric:tabular-nums;font-weight:700;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.lt{font-size:.8rem;text-align:right;color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;min-height:1.2em}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:var(--w);margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .tot{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}
.bar .sub{font-size:.78rem;color:var(--muted)}
.vh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vh b{font-size:1rem}
.num{font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.9rem;z-index:50;max-width:90vw}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:60;display:grid;place-items:center;padding:20px}
.lb img{max-width:min(92vw,520px);max-height:80vh;border-radius:10px;background:#fff}
.lb p{color:#fff;text-align:center;margin:10px 0 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;padding:16px;width:min(560px,100%);display:flex;flex-direction:column;gap:10px}
.modal textarea{height:50vh;font-family:ui-monospace,monospace;font-size:.85rem}
details summary{cursor:pointer;font-weight:700}
.hint{font-size:.82rem;color:var(--muted)}
.sync{font-size:.78rem;padding:2px 9px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}.sync:empty{display:none}.sync.ok{color:var(--ok);background:var(--ok-soft)}.sync.err{color:var(--accent);background:var(--accent-soft)}
.pill-ok{color:var(--ok);background:var(--ok-soft);padding:1px 8px;border-radius:99px;font-size:.75rem}
@media(max-width:420px){.item{grid-template-columns:auto minmax(0,1fr)}.thumb{width:52px;height:52px}.item .right{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}
/* 網頁版：寬螢幕改成雙欄清單 */
@media(min-width:900px){
  :root{--w:1120px}
  body{font-size:15.5px}
  #list,#plist{display:grid;grid-template-columns:1fr 1fr}
  #list .item,#plist .item{border-bottom:1px solid var(--line)}
  #list .item:nth-child(odd),#plist .item:nth-child(odd){border-right:1px solid var(--line)}
  .thumb{width:72px;height:72px}
  main{gap:16px}
  .btn:hover{border-color:var(--accent)}
  .item .thumb:hover{outline:2px solid var(--accent)}
}
#ilist .item{grid-template-columns:auto minmax(0,1fr) auto}
.item>*{min-width:0}
@media(prefers-reduced-motion:no-preference){.item{transition:background .15s}}
</style>

</head><body>
<header><div class="head">
  <div class="brand"><b>金春喜韓廚</b><span>餐器具叫貨</span><span class="sp"></span><span class="sync" id="syncSt"></span><button class="btn sm" id="logout" hidden>登出</button></div>
  <nav id="nav">
    <button data-v="order">叫貨</button>
    <button data-v="cart">叫貨單<span class="n" id="navN"></span></button>
    <button data-v="history">紀錄</button>
    <button data-v="items">品項</button>
    <button data-v="stores" hidden>門市</button>
  </nav>
</div></header>
<div class="wrap"><main id="main"><div class="empty">載入品項資料中…</div></main></div>
<div class="bar" id="bar" hidden><div class="in">
  <div><div class="tot" id="barTot">NT$ 0</div><div class="sub" id="barSub">尚未選取品項</div></div>
  <span class="sp"></span><button class="btn primary" id="barGo">檢視叫貨單</button>
</div></div>
<div id="layer"></div>

<script>
/* 部署 Apps Script 後，把下面的網址換成「網頁應用程式」網址（結尾是 /exec） */
const API_URL_DEFAULT='https://script.google.com/macros/s/AKfycbzNaWkLQr4K5qdAtIvieGztV5va_iuuJe7iDUZ1EMT1gl3yJwB3inV-1ZQ2WB62l0Z9/exec';
let API_URL=API_URL_DEFAULT;try{API_URL=API_URL_DEFAULT||localStorage.getItem('jcx-api')||''}catch(e){}
const SHEETS=['餐具','器具'];
const LS='jcx-order-v2',LSI='jcx-items-v2';
const VIEWS=['order','cart','history','items','stores'];
let S={store:{name:'',person:'',date:'',title:'',taxId:'',phone:'',address:'',tables:'',people:''},qty:{},note:'',history:[]};
let ITEMS=[],ORDERS=[],STORES=[],VER='',DB=false,ROLE='',CAN_ADMIN=false,PIN='',pollT=null,editImg=null,saveT;
let ui={sheet:'餐具',q:'',vendor:'',zone:'',onlySel:false,view:'order',isheet:'餐具',iq:'',iOff:false,iHide:false,sort:'date'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'NT$ '+Math.round(n).toLocaleString('en-US');
function load(){try{let raw=localStorage.getItem(LS);if(!raw){raw=localStorage.getItem('jcx-order-v1');if(raw){try{const o=JSON.parse(raw);delete o.prices;delete o.custom;delete o.store.type;raw=JSON.stringify(o)}catch(e){}}}const j=JSON.parse(raw||'null');if(j){S=Object.assign(S,j);S.store=Object.assign({name:'',person:'',date:'',title:'',taxId:'',phone:'',address:'',tables:'',people:''},S.store)}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function save(){clearTimeout(saveT);saveT=setTimeout(lsSave,200)}
function cacheItems(){try{localStorage.setItem(LSI,JSON.stringify({ver:VER,items:ITEMS}))}catch(e){}}
function toast(m,ms){const t=document.createElement('div');t.className='toast';t.textContent=m;t.style.cssText+=';white-space:normal;text-align:center';document.body.appendChild(t);setTimeout(()=>t.remove(),ms||1800)}
function typing(){const a=document.activeElement;return !!a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName)}
function setSync(t,k){const e=$('#syncSt');if(!e)return;e.textContent=t?'● '+t:'';e.className='sync'+(k?' '+k:'')}

/* ---------- 資料 ---------- */
const vis=()=>ITEMS.filter(i=>i.active!==false&&(CAN_ADMIN||i.storeOk!==false));
const byId=id=>ITEMS.find(i=>i.id===id);
const price=i=>+i.price||0;
function imgSrc(i){return i&&i.img?i.img:''}
function thumbHTML(i){const u=imgSrc(i);return u?`<button class="thumb" data-zoom="${esc(i.id)}" aria-label="放大 ${esc(i.name)}"><img alt="" loading="lazy" src="${esc(u)}"></button>`:`<div class="thumb none">無圖</div>`}
function resizeImg(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=200,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function cart(){const out=[];for(const i of vis()){const q=+S.qty[i.id]||0;if(q>0)out.push({i,q,p:price(i)})}return out}
const total=c=>c.reduce((a,x)=>a+x.p*x.q,0);
function lines(){return cart().map(({i,q,p})=>({id:i.id,sheet:i.sheet,vendor:i.vendor,name:i.name,spec:i.spec,q,p}))}
const meta=()=>({...S.store,note:S.note});
function orderText(L,m,only){
  const g={};L.forEach(x=>(g[x.vendor]=g[x.vendor]||[]).push(x));
  const vs=only?[only]:Object.keys(g);
  let s=`【金春喜韓廚 ${m.name||'（未填門市）'} 叫貨單】\n`;
  if(m.title)s+=`抬頭：${m.title}\n`;
  if(m.taxId)s+=`統編：${m.taxId}\n`;
  if(m.phone)s+=`電話：${m.phone}\n`;
  if(m.address)s+=`地址：${m.address}\n`;
  if(m.tables||m.people)s+=`桌數／人數：${m.tables||'-'} 桌／${m.people||'-'} 人\n`;
  if(m.person)s+=`叫貨人：${m.person}\n`;
  if(m.date)s+=`期望到貨：${m.date}\n`;
  let all=0;
  for(const v of vs){const a=g[v]||[];let sub=0;s+=`\n■ ${v}\n`;a.forEach((x,k)=>{s+=`${k+1}. ${x.name}${x.spec?'（'+x.spec+'）':''} ×${x.q}　@${x.p}　= ${Math.round(x.p*x.q).toLocaleString('en-US')}\n`;sub+=x.p*x.q});s+=`${v} 小計：${money(sub)}\n`;all+=sub}
  s+=`\n${only?'小計':'總計'}：${money(all)}`;
  if(m.note)s+=`\n備註：${m.note}`;
  return s}
function sheetText(L){return ['廠商\t類別\t品名\t規格\t單價\t數量\t小計'].concat(L.map(x=>[x.vendor,x.sheet,x.name.replace(/\t/g,' '),x.spec,x.p,x.q,x.p*x.q].join('\t'))).join('\n')}
async function copy(text,msg){
  try{await navigator.clipboard.writeText(text);toast(msg||'已複製');return}catch(e){}
  const l=$('#layer');l.innerHTML=`<div class="modal"><div class="box"><b>請長按全選後複製</b><textarea class="input" id="cpTa" readonly>${esc(text)}</textarea><button class="btn primary" id="cpX">關閉</button></div></div>`;
  const ta=$('#cpTa');ta.focus();ta.select();$('#cpX').onclick=()=>l.innerHTML=''}

/* ---------- 後端 ---------- */
function api(name,...args){
  if(!API_URL)return Promise.reject(new Error('no-backend'));
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:name,args:[PIN,...args]})})
    .then(r=>r.json()).then(r=>{
      if(r&&r.error==='auth'){logout('密碼已失效，請重新登入');throw new Error('auth')}
      if(r&&r.error==='server'){const e=new Error('server');e.detail=r.message||'';throw e}
      return r})}
async function loadAll(force){
  try{
    const r=await api('bootstrap',force?'':VER);
    if(r.items){ITEMS=r.items;VER=r.ver;cacheItems()}
    ORDERS=r.orders||[];STORES=r.stores||[];
    {const d=new Date();setSync('已同步 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'・'+(ROLE==='hq'?'總部':'門市'),'ok')}refreshRemote();
  }catch(e){if(e.message!=='auth')setSync('同步失敗，稍後自動重試','err')}}
function refreshRemote(){
  if(typing()||$('.modal')){updateBar();return}
  render()}
function startPoll(){clearInterval(pollT);pollT=setInterval(()=>{if(!document.hidden&&DB)loadAll()},30000)}
const histList=()=>DB?ORDERS:S.history;
async function submitOrder(){
  const L=lines();if(!L.length)return;
  const o={ts:Date.now(),store:{...S.store},note:S.note,lines:L,total:L.reduce((a,x)=>a+x.p*x.q,0),status:'待處理'};
  if(DB){try{const r=await api('submitOrder',{store:o.store,note:o.note,lines:L});if(!r||!r.ok){toast('送出失敗，請確認內容後再試');return}}catch(e){if(e.message!=='auth')toast('送出失敗，請確認網路後再試');return}}
  else S.history.unshift({id:o.ts,...o});
  S.qty={};S.note='';save();lsSave();toast(DB?'已送出給總部':'已儲存到紀錄');
  if(DB)await loadAll();setView('history')}
async function delOrder(o){if(DB){try{await api('deleteOrder',o.id);await loadAll()}catch(e){toast('刪除失敗')}}else{S.history=S.history.filter(x=>x!==o);save();vHistory()}}
async function toggleStatus(o){try{await api('setStatus',o.id,o.status==='已處理'?'待處理':'已處理');await loadAll()}catch(e){toast('更新失敗')}}
async function loadJSON(path){
  const name=path.split('/').pop(),tries=[path,name];let last=0;
  for(const p of tries){
    try{const r=await fetch(p+'?t='+Date.now());last=r.status;
      if(r.ok){try{return await r.json()}catch(e){throw new Error(p+' 內容格式不正確，請重新上傳檔案')}}
    }catch(e){if(e.message&&e.message.indexOf('內容格式')>=0)throw e;last=0}}
  throw new Error('讀不到 '+name+(last?'（HTTP '+last+'）':'')+'：請確認檔案已上傳到 GitHub 儲存庫（放在 data 資料夾或最外層都可以），並等 Pages 更新後再試')}
function need(r,what){
  if(r&&r.ok)return r;
  const c=r&&r.error;
  if(c==='bad_fn')throw new Error(what+'失敗：後端程式還是舊版。請貼上新版 Code.gs，再到「部署 → 管理部署作業 → 編輯 → 版本選新版本 → 部署」');
  if(c==='forbidden')throw new Error(what+'失敗：需要用總部密碼登入');
  if(c==='bad')throw new Error(what+'失敗：資料內容被後端拒絕，請告訴我這個訊息');
  throw new Error(what+'失敗：後端回應 '+(c||'無回應'))}
function explain(e,what){
  if(e&&e.message==='server')return what+'失敗：後端程式發生錯誤：'+(e.detail||'未知錯誤')+'（請到 Apps Script 左側「執行」查看詳情）';
  if(e&&e.message==='auth')return '密碼已失效，請重新登入';
  if(e instanceof TypeError)return what+'失敗：連不到後端，請確認網路或後端網址';
  return (e&&e.message)||what+'失敗'}
function setupUI(msg){
  $('#layer').innerHTML=`<div class="modal"><form class="box" id="setupF"><b style="font-size:1.1rem">連線設定</b>
  <span class="hint">請貼上 Apps Script「網頁應用程式」網址（https://script.google.com/macros/s/…/exec）。設定一次後，這台裝置會記住。</span>
  <input class="input" id="apiIn" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(API_URL)}" required>
  <div class="hint" id="setupMsg" style="color:var(--accent);min-height:1.2em">${esc(msg||'')}</div>
  <button class="btn primary" type="submit">儲存並前往登入</button>

    <div class="meta">${[s.title,s.taxId&&'統編 '+s.taxId,s.phone].filter(Boolean).map(esc).join('・')||'（尚未填抬頭等資料）'}</div>
    <div class="meta">${esc(s.address)}${(s.tables||s.people)?(s.address?'・':'')+esc(s.tables||'-')+' 桌／'+esc(s.people||'-')+' 人':''}</div></div>
    <button class="btn sm" data-editstore="${esc(s.id)}">編輯</button></div>`).join('')}</section>`:'<div class="card empty">還沒有門市。按「新增門市」，或「從歷史叫貨單建立門市」一次帶入。</div>')}
function storeModal(s){
  const n=!s;s=s||{name:'',title:'',taxId:'',phone:'',address:'',tables:'',people:'',person:''};
  $('#layer').innerHTML=`<div class="modal"><form class="box" id="storeF" style="max-height:92vh;overflow:auto"><b style="font-size:1.05rem">${n?'新增門市':'編輯門市'}</b>
  <div class="grid">
   <label class="f" style="grid-column:1/-1">分店名稱<input class="input" id="sfName" value="${esc(s.name)}" required></label>
   <label class="f" style="grid-column:1/-1">分店抬頭（公司名稱）<input class="input" id="sfTitle" value="${esc(s.title)}"></label>
   <label class="f">統一編號<input class="input" id="sfTax" inputmode="numeric" maxlength="8" value="${esc(s.taxId)}"></label>
   <label class="f">電話<input class="input" id="sfPhone" type="tel" value="${esc(s.phone)}"></label>
   <label class="f" style="grid-column:1/-1">地址<input class="input" id="sfAddr" value="${esc(s.address)}"></label>
   <label class="f">桌數<input class="input" id="sfTables" value="${esc(s.tables)}" inputmode="numeric"></label>
   <label class="f">人數（座位數）<input class="input" id="sfPeople" value="${esc(s.people)}" inputmode="numeric"></label>
   <label class="f" style="grid-column:1/-1">預設叫貨人（可留空）<input class="input" id="sfPerson" value="${esc(s.person)}"></label>
  </div>
  <div class="row"><button class="btn primary" type="submit">儲存</button><button class="btn" type="button" id="sfCancel">取消</button><span class="sp"></span>${n?'':'<button class="btn danger" type="button" id="sfDel">刪除</button>'}</div></form></div>`;
  $('#sfCancel').onclick=()=>{$('#layer').innerHTML=''};
  const del=$('#sfDel');if(del)del.onclick=async()=>{if(!del.dataset.arm){del.dataset.arm=1;del.textContent='再按一次確認刪除';return}
    try{const r=await api('deleteStore',s.id);if(r&&r.ok){$('#layer').innerHTML='';toast('已刪除');await loadAll()}else toast('刪除失敗')}catch(e){toast('刪除失敗')}};
  $('#storeF').onsubmit=async ev=>{ev.preventDefault();
    const o={id:n?'':s.id,name:$('#sfName').value.trim(),title:$('#sfTitle').value.trim(),taxId:$('#sfTax').value.trim(),phone:$('#sfPhone').value.trim(),address:$('#sfAddr').value.trim(),tables:$('#sfTables').value.trim(),people:$('#sfPeople').value.trim(),person:$('#sfPerson').value.trim()};
    if(!o.name){toast('請填分店名稱');return}
    try{const r=await api('saveStore',o);if(r&&r.ok){$('#layer').innerHTML='';toast('已儲存門市');await loadAll()}else toast(r&&r.error==='exists'?'已有同名門市':'儲存失敗')}catch(e){if(e.message!=='auth')toast('同步失敗，請稍後再試')}}}


/* ---------- 修改已送出的叫貨單 ---------- */
function orderEditor(o){
  const st={name:'',title:'',taxId:'',phone:'',address:'',tables:'',people:'',person:'',date:'',...(o.store||{})};
  const L=(o.lines||[]).map(x=>({...x}));let note=o.note||'';
  const fld=(k,lab,full,attr)=>`<label class="f" style="${full?'grid-column:1/-1':''}">${lab}<input class="input" data-ok="${k}" ${attr||''} value="${esc(st[k])}"></label>`;
  let busy=false;
  function paint(keepScroll){
    busy=true;const ae=document.activeElement;if(ae&&ae.blur)ae.blur();
    const sc=$('#oeBox')?$('#oeBox').scrollTop:0,tot=L.reduce((a,x)=>a+(+x.p||0)*(+x.q||0),0);
    $('#layer').innerHTML=`<div class="modal"><div class="box" id="oeBox" style="max-height:94vh;overflow:auto;width:min(880px,100%)">
     <div class="row"><b style="font-size:1.05rem">修改叫貨單</b><span class="sp"></span><span class="hint">叫貨時間與處理狀態不會改變</span></div>
     <div class="grid">${fld('name','分店名稱')}${fld('title','分店抬頭（公司名稱）')}${fld('taxId','統一編號','','inputmode="numeric"')}${fld('phone','電話','','type="tel"')}
      ${fld('address','地址',1)}${fld('tables','桌數')}${fld('people','人數（座位數）')}${fld('person','叫貨人')}
      <label class="f">期望到貨日<input class="input" type="date" data-ok="date" value="${esc(st.date)}"></label>
      <label class="f" style="grid-column:1/-1">備註<input class="input" id="oeNote" value="${esc(note)}"></label></div>
     <div style="overflow-x:auto"><table class="oe" style="width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px">
      <thead><tr style="text-align:left;color:var(--muted)"><th>品項</th><th style="width:88px">單價</th><th style="width:78px">數量</th><th style="width:96px;text-align:right">小計</th><th style="width:40px"></th></tr></thead>
      <tbody>${L.map((x,i)=>`<tr style="border-top:1px solid var(--line)"><td style="padding:6px 6px 6px 0"><b>${esc(x.name)}</b><div class="hint">${esc(x.vendor)}${x.spec?'・'+esc(x.spec):''}</div></td>
       <td><input class="input" data-lp="${i}" type="number" step="any" min="0" value="${x.p}" style="width:80px"></td>
       <td><input class="input" data-lq="${i}" type="number" min="1" step="1" value="${x.q}" style="width:70px"></td>
       <td style="text-align:right" class="num">${money((+x.p||0)*(+x.q||0))}</td><td><button class="btn sm" type="button" data-ldel="${i}" title="移除此品項">✕</button></td></tr>`).join('')}</tbody></table></div>
     <div class="row" style="margin-top:8px"><input class="input sp" id="oeAdd" list="oeDl" placeholder="輸入品名搜尋，加入品項…" autocomplete="off"><datalist id="oeDl">${ITEMS.filter(i=>i.active!==false).map(i=>`<option value="${esc(i.name+(i.spec?'｜'+i.spec:'')+'｜'+i.vendor)}">`).join('')}</datalist></div>
     <div class="row" style="margin-top:10px"><b>合計 ${L.length} 項・${money(tot)}</b><span class="sp"></span><button class="btn" type="button" id="oeCancel">取消</button><button class="btn primary" type="button" id="oeSave">儲存修改</button></div></div></div>`;
    if(keepScroll&&$('#oeBox'))$('#oeBox').scrollTop=sc;busy=false}
  const grab=()=>{document.querySelectorAll('[data-ok]').forEach(e=>{st[e.dataset.ok]=e.value.trim()});const n=$('#oeNote');if(n)note=n.value};
  paint();
  const lay=$('#layer');
  lay.onclick=e=>{const t=e.target;
    if(t.id==='oeCancel'){lay.innerHTML='';lay.onclick=lay.onchange=null;return}
    const d=t.closest('[data-ldel]');if(d){grab();L.splice(+d.dataset.ldel,1);paint(1);return}
    if(t.id==='oeSave'){grab();
      if(!st.name){toast('請填分店名稱');return}
      const lines=L.filter(x=>Math.floor(+x.q)>0&&+x.p>=0).map(x=>({id:x.id,sheet:x.sheet,vendor:x.vendor,name:x.name,spec:x.spec,q:Math.floor(+x.q),p:+x.p}));
      if(!lines.length){toast('至少要有一個品項');return}
      t.disabled=true;
      const total=lines.reduce((a,x)=>a+x.p*x.q,0);
      if(DB){api('updateOrder',o.id,{store:st,note,lines}).then(async r=>{if(r&&r.ok){lay.innerHTML='';toast('已修改叫貨單');await loadAll(true)}else{t.disabled=false;toast(r&&r.error==='forbidden'?'需要總部密碼':'修改失敗')}}).catch(e=>{t.disabled=false;if(e.message!=='auth')toast('同步失敗，請稍後再試')})}
      else{Object.assign(o,{store:st,note,lines,total});save();lsSave();lay.innerHTML='';toast('已修改');vHistory()}}};
  lay.onchange=e=>{const t=e.target;if(busy)return;
    if(t.dataset.lp!==undefined){grab();L[+t.dataset.lp].p=Math.max(0,+t.value||0);paint(1)}
    else if(t.dataset.lq!==undefined){grab();L[+t.dataset.lq].q=Math.max(1,Math.floor(+t.value)||1);paint(1)}
    else if(t.id==='oeAdd'){const v=t.value,it=ITEMS.find(i=>i.name+(i.spec?'｜'+i.spec:'')+'｜'+i.vendor===v);
      if(it){grab();const ex=L.find(x=>x.id===it.id);if(ex)ex.q=(+ex.q||0)+1;else L.push({id:it.id,sheet:it.sheet,vendor:it.vendor,name:it.name,spec:it.spec,q:1,p:price(it)});paint(1);const a=$('#oeAdd');if(a)a.focus()}}}}

/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const nb=t.closest('#nav button');if(nb){setView(nb.dataset.v);window.scrollTo(0,0);return}
  if(t.closest('#barGo')){setView('cart');window.scrollTo(0,0);return}
  if(t.id==='logout'){logout('');return}
  const so=t.closest('[data-sort]');if(so){ui.sort=so.dataset.sort;vHistory();return}
  const sg=t.closest('#seg button');if(sg){ui.sheet=sg.dataset.s;ui.vendor='';ui.zone='';vOrder();return}
  const ig=t.closest('#iseg button');if(ig){ui.isheet=ig.dataset.s;vItems();return}
  const vc=t.closest('#vchips button');if(vc){if(vc.id==='onlySel')ui.onlySel=!ui.onlySel;else ui.vendor=vc.dataset.v;vOrder();return}
  const z=t.closest('[data-zoom]');if(z){const i=byId(z.dataset.zoom);if(!i||!imgSrc(i))return;$('#layer').innerHTML=`<div class="lb" id="lb"><div><img alt="" src="${esc(imgSrc(i))}"><p>${esc(i.name)} ${esc(i.spec)}</p></div></div>`;$('#lb').onclick=()=>$('#layer').innerHTML='';return}
  const st=t.closest('.step button');if(st){const card=st.closest('.item');const inp=card.querySelector('input');setQty(card.dataset.id,(+inp.value||0)+ +st.dataset.d,card);if(ui.view==='cart')vCart();return}
  if(t.id==='applyTpl'){const n=vis().filter(i=>i.sheet===ui.sheet&&i.sug>0);n.forEach(i=>{S.qty[i.id]=i.sug});save();vOrder();toast(`已帶入${ui.sheet} ${n.length} 項的建議數量`);return}
  if(t.id==='clearAll'){if(t.dataset.arm){S.qty={};save();vOrder();toast('已清空');return}t.dataset.arm=1;t.textContent='再按一次確認清空';setTimeout(()=>{if(t.isConnected){delete t.dataset.arm;t.textContent='清空數量'}},2500);return}
  if(t.id==='cpAll'){copy(orderText(lines(),meta()),'叫貨單已複製');return}
  if(t.id==='cpSheet'){copy(sheetText(lines()),'表格已複製');return}
  const cv=t.closest('[data-copyv]');if(cv){copy(orderText(lines().filter(x=>x.vendor===cv.dataset.copyv),meta(),cv.dataset.copyv),'已複製 '+cv.dataset.copyv);return}
  if(t.id==='saveOrd'){submitOrder();return}
  const ha=t.closest('[data-act]');if(ha){const card=ha.closest('[data-h]');const o=histList().find(x=>String(x.id)===card.dataset.h);if(!o)return;
    if(ha.dataset.act==='cp')copy(orderText(o.lines,{...o.store,note:o.note}),'已複製');
    if(ha.dataset.act==='re'){S.store={...S.store,...o.store};S.qty={};o.lines.forEach(x=>{if(byId(x.id))S.qty[x.id]=x.q});S.note=o.note||'';save();toast('已載入');setView('cart')}
    if(ha.dataset.act==='xl')exportOrder(o);
    if(ha.dataset.act==='ed'){orderEditor(o);return}
    if(ha.dataset.act==='st'){toggleStatus(o)}
    if(ha.dataset.act==='del'){if(ha.dataset.arm){delOrder(o)}else{ha.dataset.arm=1;ha.textContent='再按一次刪除';setTimeout(()=>{if(ha.isConnected){delete ha.dataset.arm;ha.textContent='刪除'}},2500)}}return}
  if(t.id==='upLocal'){t.disabled=true;t.textContent='上傳中…';
    api('importOrders',S.history.map(o=>({ts:o.ts,store:o.store,note:o.note,lines:o.lines,status:o.status||'已處理'}))).then(async r=>{if(r&&r.ok){S.history=[];save();lsSave();toast('已上傳 '+r.added+' 筆');await loadAll()}else{toast('上傳失敗');t.disabled=false;t.textContent='上傳舊紀錄到雲端'}}).catch(()=>{toast('上傳失敗，請稍後再試');t.disabled=false;t.textContent='上傳舊紀錄到雲端'});return}
  if(t.id==='addStore'){storeModal(null);return}
  const es=t.closest('[data-editstore]');if(es){storeModal(STORES.find(x=>x.id===es.dataset.editstore));return}
  if(t.id==='saveAsStore'){const s=S.store,cur=sameStore();
    api('saveStore',{id:cur?cur.id:'',name:s.name.trim(),title:s.title,taxId:s.taxId,phone:s.phone,address:s.address,tables:s.tables,people:s.people,person:cur?cur.person:''}).then(async r=>{if(r&&r.ok){toast('已儲存為門市');await loadAll()}else toast(r&&r.error==='exists'?'已有同名門市，請洽總部更新':'儲存失敗')}).catch(()=>toast('同步失敗'));return}
  if(t.id==='stFromOrders'){const seen=new Set(),arr=[];
    [...ORDERS].sort((a,b)=>b.ts-a.ts).forEach(o=>{const s=o.store||{},nm=String(s.name||'').trim();if(!nm||seen.has(nm))return;seen.add(nm);arr.push({name:nm,title:s.title||'',taxId:s.taxId||'',phone:s.phone||'',address:s.address||'',tables:s.tables||'',people:s.people||'',person:''})});
    if(!arr.length){toast('叫貨紀錄裡沒有門市資料');return}
    t.disabled=true;api('mergeStores',arr).then(async r=>{t.disabled=false;if(r&&r.ok){toast(r.added?`已建立 ${r.added} 間門市`:'門市都已在列表中');await loadAll()}else toast('建立失敗')}).catch(()=>{t.disabled=false;toast('同步失敗')});return}
  if(t.id==='addItem'){itemModal(null);return}
  const ed=t.closest('[data-edit]');if(ed){itemModal(byId(ed.dataset.edit));return}
  if(t.id==='dlCatalog'){exportCatalog();return}
  if(t.id==='sokOn'||t.id==='sokOff'){const on=t.id==='sokOn',arr=iList().filter(i=>(i.storeOk!==false)!==on);
    if(!arr.length){toast(on?'目前清單都已開放':'目前清單都已隱藏');return}
    if(!t.dataset.arm){t.dataset.arm=1;const o=t.textContent;t.textContent=`再按一次確認（${arr.length} 項）`;setTimeout(()=>{if(t.isConnected){delete t.dataset.arm;t.textContent=o}},3000);return}
    t.disabled=true;api('setStoreOk',arr.map(i=>i.id),on).then(async r=>{if(r&&r.ok){toast(`已${on?'開放':'隱藏'} ${r.changed} 項給門市`);await loadAll(true)}else{t.disabled=false;toast('設定失敗')}}).catch(()=>{t.disabled=false;toast('同步失敗')});return}
  if(t.id==='iHide'){ui.iHide=!ui.iHide;vItems();return}
  if(t.id==='iOff'){ui.iOff=!ui.iOff;vItems();return}
  if(t.id==='importLegacy'){
    const old=t.textContent;t.disabled=true;t.textContent='匯入中…';
    (async()=>{try{
      const j=await loadJSON('data/legacy.json');let j2={items:[],orders:[]};try{j2=await loadJSON('data/legacy2.json')}catch(e){}
      const a=need(await api('mergeItems',[...j.items,...j2.items]),'補入品項'),b=need(await api('importOrders',[...j.orders,...j2.orders]),'匯入舊叫貨紀錄');
      {const sm=new Map();[...j.orders,...j2.orders].forEach(o=>{const s=o.store||{};if(s.name&&!sm.has(s.name))sm.set(s.name,{name:s.name,tables:s.tables||'',people:s.people||'',title:s.title||'',taxId:s.taxId||'',phone:s.phone||'',address:s.address||''})});
       (j2.stores||[]).forEach(s=>{if(!sm.has(s.name))sm.set(s.name,s)});
       try{await api('mergeStores',[...sm.values()])}catch(e){}}
      toast(`已補入 ${a.added} 項品項、${b.added} 筆舊叫貨紀錄`+(b.added===0&&a.added===0?'（先前已匯入過）':''),4000);await loadAll(true);
    }catch(e){toast(explain(e,'匯入舊資料'),9000)}finally{t.disabled=false;t.textContent='匯入舊資料'}})();
    return}
  if(t.id==='importSeed'){
    if(ITEMS.length&&!t.dataset.arm){t.dataset.arm=1;t.textContent='會覆蓋全部品項，再按一次確認';return}
    t.disabled=true;t.textContent='匯入中…';
    (async()=>{try{
      const j=await loadJSON('data/seed.json');
      const r=need(await api('importItems',j.items),'匯入品項');
      toast('已匯入 '+r.count+' 項品項',4000);await loadAll(true);
    }catch(e){toast(explain(e,'匯入品項'),9000)}finally{t.disabled=false;t.textContent='匯入初始品項';delete t.dataset.arm}})();
    return}
});
document.addEventListener('input',e=>{
  const t=e.target,S_=S.store;
  if(t.id==='q'){ui.q=t.value;drawList()}
  else if(t.id==='zone'){ui.zone=t.value;drawList()}
  else if(t.id==='iq'){ui.iq=t.value;const a=iList();$('#ilist').innerHTML=a.length?a.map(iRow).join(''):'<div class="empty">沒有符合的品項</div>'}
  else if(t.id==='stName'){S_.name=t.value;save()}
  else if(t.id==='stPerson'){S_.person=t.value;save()}
  else if(t.id==='stDate'){S_.date=t.value;save()}
  else if(t.id==='stTitle'){S_.title=t.value;save()}
  else if(t.id==='stTax'){S_.taxId=t.value;save()}
  else if(t.id==='stPhone'){S_.phone=t.value;save()}
  else if(t.id==='stAddr'){S_.address=t.value;save()}
  else if(t.id==='stTables'){S_.tables=t.value;save()}
  else if(t.id==='stPeople'){S_.people=t.value;save()}
  else if(t.id==='note'){S.note=t.value;save()}
  else if(t.closest('.step')&&t.tagName==='INPUT'){const card=t.closest('.item');const q=Math.max(0,Math.floor(+t.value||0));if(q)S.qty[card.dataset.id]=q;else delete S.qty[card.dataset.id];save();card.classList.toggle('on',q>0);card.querySelector('.lt').textContent=q?money(price(byId(card.dataset.id))*q):'';updateBar()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='stPick'){if(t.value)pickStore(t.value);return}
  if(t.classList.contains('sok')){
    if(!CAN_ADMIN)return;const it=byId(t.closest('[data-iid]').dataset.iid);if(!it)return;
    const old=it.storeOk!==false;it.storeOk=t.checked;
    api('setStoreOk',[it.id],t.checked).then(r=>{if(r&&r.ok){toast(t.checked?'門市可叫貨':'已對門市隱藏');loadAll(true)}else{it.storeOk=old;t.checked=old;toast('更新失敗')}}).catch(()=>{it.storeOk=old;t.checked=old;toast('同步失敗')});return}
  if(t.classList.contains('pin')){
    if(!CAN_ADMIN)return;const it=byId(t.closest('[data-iid]').dataset.iid);const v=t.value===''?NaN:+t.value;
    if(!it)return;if(!(v>=0)){t.value=price(it);return}if(v===price(it))return;
    const old=it.price;it.price=v;
    api('saveItem',{...it}).then(r=>{if(r&&r.ok){toast('已更新單價');loadAll(true)}else{it.price=old;t.value=old;toast('更新失敗')}}).catch(()=>{it.price=old;t.value=old;toast('同步失敗')})}
  else if(t.closest('.step')&&t.tagName==='INPUT'&&ui.view==='cart'){vCart()}
});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.includes(v)&&v!==ui.view){ui.view=v;render()}});
(function(){load();const v=location.hash.slice(1);if(VIEWS.includes(v))ui.view=v;render();boot()})();
</script>
